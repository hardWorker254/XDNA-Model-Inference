[package]
name = "npuembeddings-cli"
description = "The three executables: npuembeddings, npuaudio and npuimage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "npuembeddings"
path = "src/bin/npuembeddings.rs"

[[bin]]
name = "npuaudio"
path = "src/bin/npuaudio.rs"

[[bin]]
name = "npuimage"
path = "src/bin/npuimage.rs"

[dependencies]
npum-families.workspace = true
npum-format.workspace = true
npum-model.workspace = true
npum-tokenizers.workspace = true
npum-cpu.workspace = true
npum-vulkan.workspace = true
npum-xdna.workspace = true
npuembeddings-server = { path = "../server" }
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# The transport the array path speaks through.
#
# The XRT transport is the default: it is what this project has always
# used, and what a machine with XRT installed has. The direct transport is
# the `amdxdna` driver's ioctls -- no XRT, no C++, and no Python -- and a
# build with both speaks the direct one.
default = ["xrt"]
xrt = ["npum-xdna/xrt"]
direct = ["npum-xdna/direct"]
