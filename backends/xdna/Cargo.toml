[package]
name = "npum-xdna"
description = "The NPU backend: XDNA1 (aie2) and XDNA2 (aie2p), over XRT or over the driver directly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The XRT transport: a small C shim over XRT's C++ API, compiled by build.rs.
#
# DEFAULT ON, because it is what this project has always used and what a
# machine with XRT installed has. It is a DEFAULT and not a hard dependency
# so that a machine WITHOUT XRT can still build the runtime for the CPU and
# Vulkan backends.
default = ["xrt"]

# The XRT transport.
xrt = []

# The direct transport: ioctls of the amdxdna driver on /dev/accel/accel0.
#
# No XRT, no C++, and no PYTHONPATH=/opt/xilinx/xrt/python -- which is what
# the C++ runtime needed, and the reason it required Python to run at all.
direct = []

[dependencies]
npum-format.workspace = true
npum-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
