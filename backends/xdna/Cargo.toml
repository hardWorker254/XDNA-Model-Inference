[package]
name = "npum-xdna"
description = "The NPU backend: XDNA1 (aie2) and XDNA2 (aie2p), over XRT or over the driver directly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The XRT transport: a small C shim over XRT's reference API, compiled by build.rs.
#
# DEFAULT ON, because it is what this project has always used and what a
# machine with XRT installed has. It is a DEFAULT and not a hard dependency
# so that a machine WITHOUT XRT can still build the runtime for the CPU and
# Vulkan backends.
default = ["xrt"]

# The XRT transport.
xrt = []

# The direct transport: ioctls of the amdxdna driver on /dev/accel/accel0.
#
# No XRT, no reference, and no PYTHONPATH=/opt/xilinx/xrt/python -- which is what
# the reference runtime needed, and the reason it required Python to run at all.
direct = []

[dependencies]
npum-format.workspace = true
npum-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The gate beside the convolution one drives a WHOLE FAMILY over the array:
# the pose network out of a container that ships the array's panels. The
# family lives in npum-cpu, and a DEV-dependency is the right edge for it:
# the backend does not know the family at run time, and the test needs both.
npum-cpu.workspace = true

[build-dependencies]
