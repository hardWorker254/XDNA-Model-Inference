[package]
name = "npum-cpu"
description = "The CPU backend: the accuracy reference every other backend is measured against."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
libm = "0.2"
npum-format.workspace = true
npum-model.workspace = true
rayon = "1.10"
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
npum-tokenizers.workspace = true
serde_json.workspace = true

# A dependency-free benchmark harness: `cargo bench -p npum-cpu --bench gemm`.
# It prints the time and GFLOP/s of the hot GEMM shapes so a kernel change can
# be measured on the target machine instead of guessed at.
[[bench]]
name = "gemm"
harness = false
