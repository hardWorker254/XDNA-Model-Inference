[package]
name = "npum-vulkan"
description = "The GPU backend: Vulkan through ash, with WGSL shaders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []

[dependencies]
ash = "0.38"
npum-cpu.workspace = true
npum-format.workspace = true
npum-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
# The WGSL front end and the SPIR-V back end, and nothing else: the shaders
# are compiled here rather than at start-up.
naga = { version = "30", default-features = false, features = ["wgsl-in", "spv-out"] }

[dev-dependencies]
# The gates run the TEXT family end to end, and the family needs a
# tokenizer to have something to encode.
npum-tokenizers.workspace = true
